<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; overflow: hidden; }
canvas {
  display: block;
  max-width: 100%;
  cursor: crosshair;
  touch-action: none;
  border-radius: 8px;
  border: 2px solid #c084fc;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Streamlit component protocol ──────────────────────────────────────────
function stReady()       { window.parent.postMessage({type:'streamlit:componentReady', apiVersion:1}, '*'); }
function stValue(v)      { window.parent.postMessage({type:'streamlit:setComponentValue', value:v}, '*'); }
function stHeight(h)     { window.parent.postMessage({type:'streamlit:setFrameHeight', height:h}, '*'); }

// ── State ─────────────────────────────────────────────────────────────────
var canvas   = document.getElementById('c');
var ctx      = canvas.getContext('2d');
var paths    = [];
var cur      = [];
var drawing  = false;
var brushW   = 12;
var img      = null;
var lastReset = -1;
var inited   = false;

// ── Receive messages from Streamlit ───────────────────────────────────────
window.addEventListener('message', function(e) {
  if (e.data.type !== 'streamlit:render') return;
  var a = e.data.args;
  brushW = a.brushSize || 12;

  if (!inited) {
    inited = true;
    canvas.width  = a.width;
    canvas.height = a.height;
    stHeight(a.height + 6);

    img = new Image();
    img.onload = redraw;
    img.src = a.imageData;

    // Mouse events
    canvas.addEventListener('mousedown',  onDown);
    canvas.addEventListener('mousemove',  onMove);
    canvas.addEventListener('mouseup',    onUp);
    canvas.addEventListener('mouseleave', onUp);
    // Touch events
    canvas.addEventListener('touchstart', function(e){ e.preventDefault(); onDown(e.touches[0]); }, {passive:false});
    canvas.addEventListener('touchmove',  function(e){ e.preventDefault(); onMove(e.touches[0]); }, {passive:false});
    canvas.addEventListener('touchend',   function(e){ e.preventDefault(); onUp(); },               {passive:false});
  }

  // Reset strokes when reset counter changes
  if (a.reset !== undefined && a.reset !== lastReset) {
    lastReset = a.reset;
    paths = [];
    redraw();
  }
});

stReady();

// ── Coordinate helper (accounts for CSS scaling) ──────────────────────────
function getPos(e) {
  var r  = canvas.getBoundingClientRect();
  var sx = canvas.width  / r.width;
  var sy = canvas.height / r.height;
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}

// ── Draw event handlers ───────────────────────────────────────────────────
function onDown(e) { drawing = true; cur = [getPos(e)]; }
function onMove(e) { if (!drawing) return; cur.push(getPos(e)); redraw(); }
function onUp() {
  if (!drawing) return;
  drawing = false;
  if (cur.length) {
    paths.push({ points: cur.slice(), width: brushW });
    cur = [];
    redraw();
    stValue({ paths: paths });
  }
}

// ── Rendering ─────────────────────────────────────────────────────────────
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }
  var all = paths.concat(cur.length ? [{ points: cur, width: brushW }] : []);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(220,30,30,0.85)';
  ctx.fillStyle   = 'rgba(220,30,30,0.85)';
  for (var i = 0; i < all.length; i++) {
    var p = all[i];
    ctx.lineWidth = p.width;
    ctx.beginPath();
    if (p.points.length === 1) {
      ctx.arc(p.points[0].x, p.points[0].y, p.width / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.moveTo(p.points[0].x, p.points[0].y);
      for (var j = 1; j < p.points.length; j++) {
        ctx.lineTo(p.points[j].x, p.points[j].y);
      }
      ctx.stroke();
    }
  }
}
</script>
</body>
</html>
